[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-rag-graph"
version = "0.1.0"
description = "A minimal Gemini-powered RAG example built with LangGraph and Qdrant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.4.0",
  "langchain-core>=0.3.0",
  "langchain-google-genai>=1.0.10",
  "langchain-text-splitters>=0.3.0",
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "pypdf>=5.0.0",
  "uvicorn>=0.30.0",
  "python-dotenv>=1.0.1",
  "langgraph-checkpoint-postgres>=2.0.0",
  "psycopg[binary]>=3.0.0",
]

[project.scripts]
rag-graph = "rag_graph.cli:main"
rag-graph-api = "rag_graph.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
